version: 2

# Snapshot = a table that keeps HISTORY (SCD Type 2: every change becomes a new row).
# Each `dbt snapshot` run compares stg_customers with what the snapshot saw last time:
#   * new customer          -> insert a row (dbt_valid_to = NULL, meaning "current")
#   * customer changed      -> close the old row (fill dbt_valid_to) and insert the new version
#   * nothing changed       -> do nothing
# "Changed" is decided by the updated_at column (timestamp strategy): a newer updated_at = a new version.

snapshots:
  - name: customers_snapshot
    relation: ref('stg_customers')
    description: >
      History of customer profiles (SCD Type 2). One row per version of each customer.
      dbt_valid_from / dbt_valid_to show when each version was current; dbt_valid_to is NULL
      for the current version.
    config:
      schema: snapshots          # kept apart from models, so history is never rebuilt by accident
      unique_key: customer_id
      strategy: timestamp
      updated_at: updated_at
    columns:
      - name: customer_id
        data_tests:
          - not_null
      - name: dbt_scd_id
        description: Unique id of each version row (created by dbt).
        data_tests:
          - unique
          - not_null
      - name: dbt_valid_from
        description: When this version became current.
      - name: dbt_valid_to
        description: When this version stopped being current. NULL = current version.
