version: 2

# Final reporting tables (star schema). Test data is excluded here.

models:
  - name: dim_date
    description: One row per calendar day, from the earliest data up to today. Use it like a Power BI date table.
    columns:
      - name: date_day
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: month_start
        description: First day of the month (use it to group by month).
      - name: week_start
        description: Monday of the week.
      - name: day_of_week
        description: 1 = Monday ... 7 = Sunday.
      - name: is_weekend
        description: TRUE on Saturday and Sunday.

  - name: dim_customers
    description: >
      One row per real customer (test accounts removed), with their first-touch channel
      and a summary of their completed orders.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: first_touch_channel
        description: Channel of the customer's first visit (the channel that "found" them).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['google', 'meta', 'email', 'direct']
      - name: completed_orders
        description: Number of completed orders (0 if none).
        data_tests:
          - not_null
      - name: lifetime_revenue
        description: Total revenue from completed orders, in USD.
        data_tests:
          - not_null
      - name: has_purchased
        description: TRUE if the customer has at least one completed order.

  - name: dim_campaigns
    description: One row per marketing campaign, with totals of its ad spend.
    columns:
      - name: campaign_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: campaign_name
        data_tests:
          - unique
          - not_null
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['google', 'meta', 'email']
      - name: total_spend
        description: Total spend over the whole period, in USD.
